name: Portfolio mobile quality audit

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/portfolio-mobile-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and required local assets
        run: |
          node --check assets/js/script.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.local = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag in ('script','img','link'):
                      p = d.get('src') or d.get('href')
                      if p and p.startswith('./assets/'):
                          self.local.append(p[2:].split('?')[0])
          a=Assets()
          a.feed(Path('index.html').read_text(encoding='utf-8'))
          missing=[p for p in a.local if not Path(p).exists()]
          print('Local referenced assets:',len(a.local), 'Missing:',missing)
          if missing: raise SystemExit(1)
          PY
      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          sleep 3
      - name: Run mobile Lighthouse lab audit
        run: |
          npx --yes lighthouse@12 http://127.0.0.1:8000/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --preset=perf --output=json --output-path=/tmp/portfolio-lighthouse.json --quiet
      - name: Print mobile scores and timings
        if: always()
        run: |
          if [ -f /tmp/portfolio-lighthouse.json ]; then
            node - <<'JS'
          const r = require('/tmp/portfolio-lighthouse.json');
          for(const [name,cat] of Object.entries(r.categories || {})) {
            console.log('LIGHTHOUSE '+name.toUpperCase()+' SCORE: '+Math.round((cat.score||0)*100));
          }
          for(const [id,name] of [['first-contentful-paint','FCP'],['largest-contentful-paint','LCP'],['speed-index','Speed Index'],['total-blocking-time','TBT'],['cumulative-layout-shift','CLS']]) {
            const a=r.audits[id];
            if(a) console.log('LIGHTHOUSE '+name+': '+a.displayValue+' ('+a.numericValue+')');
          }
          console.log('LIGHTHOUSE FINAL URL: '+r.finalDisplayedUrl);
          JS
          else
            echo "Lighthouse did not produce a result. Inspect the audit step."
          fi
      - name: Upload Lighthouse JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-mobile-lighthouse
          path: /tmp/portfolio-lighthouse.json
          if-no-files-found: warn
